name: Build and Deploy
on:
  push:
    branches: [ main ]


  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:
  # Build job
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout
      uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    
    - name: Install Dependencies
      run: npm ci
    
    - uses: microsoft/variable-substitution@v1 
      with:
          files: 'src/config/env.json'
      env:
          apiUrl: "https://api.latinonet.online"
          clientId: "callforspeakers"
          redirectUri: "https://latinonet.online/callforspeakers"
          postLogoutRedirectUri: "https://latinonet.online/callforspeakers/signout-redirect"
          

    - uses: microsoft/variable-substitution@v1 
      with:
          files: 'package.json'
      env:
          homepage: "https://latinonet.online/callforspeakers"
       

    - name: Build
      run: npm run build
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: build
        
        
        
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
